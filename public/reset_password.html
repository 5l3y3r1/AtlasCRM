<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>AtlasCRM — პაროლის აღდგენა</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/img/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/js/lucide.min.js?v=1"></script>
<style>
:root {
    --brand: #1D4ED8; --brand-hover: #1E3A8A;
    --bg: #F8FAFC; --surface: #FFFFFF; --surface-2: #F1F5F9;
    --text: #0F172A; --text-muted: #64748B; --text-subtle: #94A3B8;
    --border: #E2E8F0;
    --success: #10B981; --success-soft: #ECFDF5;
    --danger: #EF4444; --danger-soft: #FEF2F2;
    --radius-sm: 6px; --radius-lg: 14px; --radius-xl: 18px;
    --shadow-xl: 0 20px 25px -5px rgba(15,23,42,.1), 0 8px 10px -6px rgba(15,23,42,.04);
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: var(--font-sans); background: var(--bg); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    color: var(--text); -webkit-font-smoothing: antialiased;
    background-image:
        radial-gradient(circle at 15% 30%, rgba(29, 78, 216,.04), transparent 40%),
        radial-gradient(circle at 85% 70%, rgba(15,23,42,.04), transparent 40%);
}
.container { width: 100%; max-width: 460px; }
.logo { text-align: center; margin-bottom: 24px; }
.logo-icon {
    width: 56px; height: 56px; margin: 0 auto; border-radius: var(--radius-lg);
    background: var(--brand); color: #fff; display: flex; align-items: center;
    justify-content: center; box-shadow: 0 8px 24px rgba(29, 78, 216,.25);
}
.logo-icon [data-lucide] { font-size: 28px; }
.logo-icon svg { width: 28px; height: 28px; }
.logo-text { font-size: 28px; font-weight: 700; margin-top: 12px; letter-spacing: -.5px; }
.card {
    background: var(--surface); border-radius: var(--radius-xl); padding: 28px;
    box-shadow: var(--shadow-xl); border: 1px solid var(--border);
}
h2 { font-size: 20px; margin-bottom: 6px; font-weight: 700; letter-spacing: -.3px; }
.subtitle { font-size: 13.5px; color: var(--text-muted); margin-bottom: 22px; }
label { display: block; font-size: 12.5px; font-weight: 600; margin: 14px 0 6px; }
input {
    width: 100%; padding: 11px 14px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-size: 14px; background: var(--surface);
    font-family: inherit; color: var(--text); transition: border-color .15s, box-shadow .15s;
}
input::placeholder { color: var(--text-subtle); }
input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(29, 78, 216,.1); }
.btn-main {
    width: 100%; padding: 12px; background: var(--brand); color: #fff; border: none;
    border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer;
    margin-top: 22px; font-family: inherit; transition: background .15s;
}
.btn-main:hover:not(:disabled) { background: var(--brand-hover); }
.btn-main:disabled { opacity: .6; cursor: not-allowed; }
.alert {
    display: none; padding: 11px 14px; border-radius: var(--radius-sm);
    font-size: 13px; margin-bottom: 4px; line-height: 1.5;
}
.alert.show { display: block; }
.alert.error { background: var(--danger-soft); color: #B91C1C; }
.alert.success { background: var(--success-soft); color: #047857; }
.foot { text-align: center; margin-top: 16px; }
.foot a { font-size: 13px; color: var(--text-muted); text-decoration: none; }
.hint { font-size: 12px; color: var(--text-subtle); margin-top: 6px; }
</style>
</head>
<body>
<div class="container">
    <div class="logo">
        <div class="logo-icon"><svg viewBox="0 0 100 100" style="width:60%;height:60%"><path d="M 29 74 L 50 25 L 71 74" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><line x1="37.5" y1="55" x2="62.5" y2="55" stroke="#fff" stroke-width="12" stroke-linecap="round"/></svg></div>
        <div class="logo-text">AtlasCRM</div>
    </div>
    <div class="card">
        <div class="alert" id="alert"></div>

        <div id="form-reset">
            <h2 id="h-title">ახალი პაროლი</h2>
            <div class="subtitle" id="h-sub">შეიყვანე ახალი პაროლი შენი ანგარიშისთვის</div>

            <label id="l-pass">ახალი პაროლი</label>
            <input type="password" id="new-password" placeholder="მინ. 8 სიმბოლო" autocomplete="new-password">

            <label id="l-conf">გაიმეორე პაროლი</label>
            <input type="password" id="confirm-password" autocomplete="new-password">
            <div class="hint" id="h-hint">პაროლის შეცვლის შემდეგ ყველა მოწყობილობიდან გამოხვალ სისტემიდან.</div>

            <button type="button" class="btn-main" id="btn-reset">პაროლის შეცვლა</button>
        </div>

        <div class="foot"><a href="/login" id="l-back">← შესვლაზე დაბრუნება</a></div>
    </div>
</div>

<script>
// The token arrives in the URL. It is used once, then the browser is sent to
// the login page — it is never stored client-side.
const TOKEN = new URLSearchParams(location.search).get('token') || '';

const LANG = (function () { try { return localStorage.getItem('atlas_lang') || localStorage.getItem('warm_lang') || 'ka'; } catch (e) { return 'ka'; } })();
const S = {
    title:      { ka: 'ახალი პაროლი', en: 'New password' },
    sub:        { ka: 'შეიყვანე ახალი პაროლი შენი ანგარიშისთვის', en: 'Choose a new password for your account' },
    pass:       { ka: 'ახალი პაროლი', en: 'New password' },
    conf:       { ka: 'გაიმეორე პაროლი', en: 'Repeat password' },
    placeholder:{ ka: 'მინ. 8 სიმბოლო', en: 'min. 8 characters' },
    hint:       { ka: 'პაროლის შეცვლის შემდეგ ყველა მოწყობილობიდან გამოხვალ სისტემიდან.', en: 'Changing your password signs you out on every device.' },
    btn:        { ka: 'პაროლის შეცვლა', en: 'Change password' },
    back:       { ka: '← შესვლაზე დაბრუნება', en: '← Back to sign in' },
    no_token:   { ka: 'ბმული არასწორია. მოითხოვე ახალი აღდგენის ბმული.', en: 'This link is not valid. Please request a new reset link.' },
    too_short:  { ka: 'პაროლი მინ. 8 სიმბოლო', en: 'Password must be at least 8 characters' },
    mismatch:   { ka: 'პაროლები არ ემთხვევა', en: 'Passwords do not match' },
    working:    { ka: 'მუშავდება...', en: 'Working...' },
    ok:         { ka: 'პაროლი შეიცვალა. გადამისამართება შესვლაზე...', en: 'Password changed. Redirecting to sign in...' },
    failed:     { ka: 'ვერ მოხერხდა. სცადე თავიდან.', en: 'Something went wrong. Please try again.' },
};
const t = k => (S[k] && S[k][LANG]) || k;

function setText(id, key) { const el = document.getElementById(id); if (el) el.textContent = t(key); }
function alertBox(msg, type) {
    const a = document.getElementById('alert');
    a.textContent = msg;
    a.className = 'alert show ' + (type || 'error');
}

window.addEventListener('load', () => {
    document.documentElement.lang = LANG;
    setText('h-title', 'title'); setText('h-sub', 'sub');
    setText('l-pass', 'pass'); setText('l-conf', 'conf');
    setText('h-hint', 'hint'); setText('btn-reset', 'btn'); setText('l-back', 'back');
    document.getElementById('new-password').placeholder = t('placeholder');

    if (window.lucide) { try { window.lucide.createIcons(); } catch (e) {} }

    // No token in the URL means the link was mangled or typed by hand. Say so
    // up front rather than letting someone fill the form and fail at submit.
    if (!TOKEN) {
        alertBox(t('no_token'));
        document.getElementById('form-reset').style.display = 'none';
    }

    document.getElementById('btn-reset').addEventListener('click', doReset);
    document.getElementById('confirm-password').addEventListener('keypress', e => {
        if (e.key === 'Enter') doReset();
    });
});

async function doReset() {
    const pw = document.getElementById('new-password').value;
    const cf = document.getElementById('confirm-password').value;
    if (pw.length < 8)  { alertBox(t('too_short')); return; }
    if (pw !== cf)      { alertBox(t('mismatch')); return; }

    const btn = document.getElementById('btn-reset');
    btn.disabled = true;
    btn.textContent = t('working');
    try {
        const r = await fetch('/api/auth/reset-password', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: TOKEN, password: pw })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) { alertBox(j.error || t('failed')); return; }
        alertBox(t('ok'), 'success');
        document.getElementById('form-reset').style.display = 'none';
        setTimeout(() => { location.href = '/login'; }, 2500);
    } catch (e) {
        alertBox(t('failed'));
    } finally {
        btn.disabled = false;
        btn.textContent = t('btn');
    }
}
</script>
</body>
</html>
