<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>AtlasCRM — შესვლა</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/img/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/js/lucide.min.js?v=1"></script>
<script src="/js/supabase-shim.js?v=1"></script>
<style>
/* ════════════════════════════════════════════════════════════════
   AtlasCRM — Production design system
   Single source of truth for colours, typography, icons.
   ════════════════════════════════════════════════════════════════ */

:root {
    /* Brand */
    --brand:           #1D4ED8;   /* ember terracotta */
    --brand-hover:     #1E3A8A;
    --brand-soft:      #EFF6FF;
    --brand-soft-2:    #DBEAFE;
    --brand-border:    #BFDBFE;

    /* Surfaces */
    --bg:              #F8FAFC;
    --surface:         #FFFFFF;
    --surface-2:       #F1F5F9;
    --surface-hover:   #F8FAFC;

    /* Text */
    --text:            #0F172A;
    --text-muted:      #64748B;
    --text-subtle:     #94A3B8;

    /* Borders */
    --border:          #E2E8F0;
    --border-strong:   #CBD5E1;

    /* States */
    --success:         #10B981;
    --success-soft:    #ECFDF5;
    --warning:         #F59E0B;
    --warning-soft:    #FFFBEB;
    --danger:          #EF4444;
    --danger-soft:     #FEF2F2;
    --info:            #3B82F6;
    --info-soft:       #EFF6FF;
    --purple:          #8B5CF6;
    --purple-soft:     #F5F3FF;

    /* Sidebar dark variant */
    --sidebar-bg:      #0F172A;
    --sidebar-bg-2:    #1E293B;
    --sidebar-text:    #CBD5E1;
    --sidebar-text-strong: #F8FAFC;
    --sidebar-hover:   rgba(255,255,255,0.06);

    /* Shadows */
    --shadow-xs:       0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-sm:       0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-md:       0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
    --shadow-lg:       0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
    --shadow-xl:       0 20px 25px -5px rgba(15, 23, 42, 0.1),  0 8px 10px -6px rgba(15, 23, 42, 0.04);

    /* Radius */
    --radius-sm:       6px;
    --radius:          10px;
    --radius-lg:       14px;
    --radius-xl:       18px;

    /* Type scale */
    --font-sans:       'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-display:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

/* Lucide icon defaults — sized via container font-size */
.lucide-i,
[data-lucide] {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    vertical-align: -2px;
}
.lucide-i svg,
[data-lucide] svg {
    width: 1em;
    height: 1em;
    stroke-width: 1.75;
}
/* Default size scale based on parent */
.kpi-icon .lucide-i,
.kpi-icon [data-lucide] { font-size: 20px; }
.brand-icon .lucide-i,
.brand-icon [data-lucide] { font-size: 22px; color: white; }
.nav-icon .lucide-i,
.nav-icon [data-lucide] { font-size: 18px; }
.pipeline-icon .lucide-i,
.pipeline-icon [data-lucide] { font-size: 18px; }
.stage-icon .lucide-i,
.stage-icon [data-lucide] { font-size: 18px; }

/* Flag chips for language switcher */
.flag-tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    min-width: 22px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--surface-2);
    color: var(--text-muted);
    border: 1px solid var(--border);
}

/* Focus ring (a11y) */
*:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
}


* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: var(--font-sans);
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    /* subtle background pattern */
    background-image:
        radial-gradient(circle at 15% 30%, rgba(29, 78, 216,0.04), transparent 40%),
        radial-gradient(circle at 85% 70%, rgba(15,23,42,0.04), transparent 40%);
}

.container { width: 100%; max-width: 460px; }

.logo {
    text-align: center;
    margin-bottom: 24px;
    color: var(--text);
}
.logo-icon {
    width: 56px; height: 56px;
    margin: 0 auto;
    border-radius: var(--radius-lg);
    background: var(--brand);
    color: white;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(29, 78, 216,0.25);
}
.logo-icon .lucide-i, .logo-icon [data-lucide] { font-size: 28px; }
.logo-text { font-size: 28px; font-weight: 700; margin-top: 12px; letter-spacing: -0.5px; color: var(--text); }
.logo-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

.card {
    background: var(--surface);
    border-radius: var(--radius-xl);
    padding: 28px;
    box-shadow: var(--shadow-xl);
    border: 1px solid var(--border);
}

.tabs {
    display: flex;
    background: var(--surface-2);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 24px;
    border: 1px solid var(--border);
}
.tab {
    flex: 1;
    padding: 9px 10px;
    text-align: center;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-weight: 600;
    font-size: 13.5px;
    color: var(--text-muted);
    border: none;
    background: transparent;
    font-family: inherit;
    transition: background .15s, color .15s, box-shadow .15s;
}
.tab:hover { color: var(--text); }
.tab.active {
    background: var(--surface);
    color: var(--brand);
    box-shadow: var(--shadow-xs);
}

.form { display: none; }
.form.active { display: block; }

h2 { font-size: 20px; margin-bottom: 6px; color: var(--text); font-weight: 700; letter-spacing: -0.3px; }
.subtitle { font-size: 13.5px; color: var(--text-muted); margin-bottom: 22px; }

label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
    margin-top: 14px;
}

input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: var(--surface);
    font-family: inherit;
    color: var(--text);
    transition: border-color .15s, box-shadow .15s;
}
input::placeholder { color: var(--text-subtle); }
input:focus {
    outline: none;
    border-color: var(--brand);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(29, 78, 216,0.1);
}

.btn-main {
    width: 100%;
    padding: 12px;
    background: var(--brand);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 22px;
    font-family: inherit;
    transition: background .15s;
}
.btn-main:hover:not(:disabled) { background: var(--brand-hover); }
.btn-main:disabled { opacity: 0.6; cursor: wait; }

.alert {
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 14px;
    font-size: 13.5px;
    display: none;
    border: 1px solid transparent;
}
.alert.show { display: block; }
.alert.error   { background: var(--danger-soft);  color: #B91C1C; border-color: #FCA5A5; }
.alert.success { background: var(--success-soft); color: #047857; border-color: #6EE7B7; }

.footer {
    text-align: center;
    color: var(--text-subtle);
    font-size: 12px;
    margin-top: 22px;
}
.footer .flag-tag { background: transparent; border-color: var(--border); }

@media (max-width: 520px) {
    .container { max-width: 100%; padding: 0 4px; }
    input { font-size: 16px; padding: 13px 14px; } /* prevent iOS zoom */
    .logo-text { font-size: 24px; }
    body { padding: 16px; }
}
</style>
</head>
<body>

<div class="container">
    <div class="logo">
        <div class="logo-icon"><svg viewBox="0 0 100 100" style="width:60%;height:60%"><path d="M 29 74 L 50 25 L 71 74" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><line x1="37.5" y1="55" x2="62.5" y2="55" stroke="#fff" stroke-width="12" stroke-linecap="round"/></svg></div>
        <div class="logo-text">AtlasCRM</div>
        <div class="logo-sub">საქართველოს უძრავი ქონების CRM</div>
    </div>

    <div class="card">

        <div class="alert" id="alert"></div>

        <!-- LOGIN -->
        <div class="form active" id="form-login">
            <h2 data-i18n="login_title">მოგესალმები</h2>
            <div class="subtitle" data-i18n="login_subtitle">შედი შენს ანგარიშში</div>

            <label data-i18n="email">ელ. ფოსტა</label>
            <input type="email" id="login-email" placeholder="email@example.com">

            <label data-i18n="password">პაროლი</label>
            <div style="position:relative">
                <input type="password" id="login-password" placeholder="••••••••" style="padding-right:42px">
                <span onclick="togglePw('login-password',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#888;user-select:none"><i data-lucide="eye" class="lucide-i"></i></span>
            </div>

            <button type="button" class="btn-main" id="btn-login" data-i18n="login_btn">შესვლა</button>
            <div style="text-align:center;margin-top:14px">
                <a href="#" onclick="showForgot();return false" style="font-size:13px;color:#888;text-decoration:none" data-i18n="forgot_link">პაროლი დაგავიწყდა?</a>
            </div>
        </div>

        <!-- FORGOT PASSWORD -->
        <div class="form" id="form-forgot">
            <h2 data-i18n="forgot_title">პაროლის აღდგენა</h2>
            <div class="subtitle" data-i18n="forgot_subtitle">მიუთითე ელფოსტა — გამოგიგზავნით აღდგენის ბმულს</div>

            <label data-i18n="email">ელ. ფოსტა</label>
            <input type="email" id="forgot-email" placeholder="email@example.com">

            <button type="button" class="btn-main" id="btn-forgot" data-i18n="forgot_btn">ბმულის გაგზავნა</button>
            <div style="text-align:center;margin-top:14px">
                <a href="#" onclick="showLogin();return false" style="font-size:13px;color:#888;text-decoration:none" data-i18n="back_to_login">← შესვლაზე დაბრუნება</a>
            </div>
        </div>
    </div>

    <div class="footer">
        <a href="/terms" style="color:inherit;text-decoration:none">წესები</a>
        ·
        <a href="/privacy" style="color:inherit;text-decoration:none">კონფიდენციალურობა</a>
        ·
        © 2026 AtlasCRM
        <button onclick="setLang('ka')" id="lang-ka" class="flag-tag" style="cursor:pointer">KA</button>
        <button onclick="setLang('en')" id="lang-en" class="flag-tag" style="cursor:pointer">EN</button>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://mqibuuxxokiomsmidbmz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZK77l2lbh2G_ebmt3qC1KA_-QJ6ioKk';

let client;

window.addEventListener('load', () => {
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    document.getElementById('btn-login').addEventListener('click', doLogin);

    document.getElementById('login-password').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') doLogin();
    });
    document.getElementById('btn-forgot').addEventListener('click', doForgot);
    document.getElementById('forgot-email').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') doForgot();
    });
});

function switchTab(name) {
    // Registration removed — login is the only view. Kept as a safe no-op.
    hideAlert();
}

// ── Forgot password ──
function showForm(id) {
    hideAlert();
    document.querySelectorAll('.form').forEach(f => f.classList.toggle('active', f.id === id));
}
function showForgot() {
    showForm('form-forgot');
    document.getElementById('forgot-email').value = document.getElementById('login-email').value.trim();
}
function showLogin() { showForm('form-login'); }

async function doForgot() {
    const email = document.getElementById('forgot-email').value.trim();
    if (!email) { showAlert(t('forgot_need_email')); return; }

    const btn = document.getElementById('btn-forgot');
    btn.disabled = true;
    btn.textContent = t('sending');
    try {
        const r = await fetch('/api/auth/forgot-password', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            credentials: 'include', body: JSON.stringify({ email })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) { showAlert(j.error || t('forgot_failed')); return; }
        // Switch back FIRST: showForm() calls hideAlert(), so showing the
        // message before the switch would wipe it immediately.
        showForm('form-login');
        // The server deliberately answers the same whether or not the address
        // exists, so the UI must not imply an account was found either.
        showAlert(t('forgot_sent'), 'success');
    } catch (e) {
        showAlert(t('forgot_failed'));
    } finally {
        btn.disabled = false;
        btn.textContent = t('forgot_btn');
    }
}

function togglePw(id, el) {
    const inp = document.getElementById(id);
    const showing = inp.type === 'text';
    inp.type = showing ? 'password' : 'text';
    el.innerHTML = '<i data-lucide="' + (showing ? 'eye' : 'eye-off') + '" class="lucide-i"></i>';
    if (window.lucide && window.lucide.createIcons) { try { window.lucide.createIcons(); } catch(e){} }
}

// ── i18n ──
const I18N = {
    tab_login:        { ka: 'შესვლა', en: 'Sign in' },
    tab_register:     { ka: 'რეგისტრაცია', en: 'Register' },
    login_title:      { ka: 'მოგესალმები', en: 'Welcome' },
    login_subtitle:   { ka: 'შედი შენს ანგარიშში', en: 'Sign in to your account' },
    email:            { ka: 'ელ. ფოსტა', en: 'Email' },
    password:         { ka: 'პაროლი', en: 'Password' },
    login_btn:        { ka: 'შესვლა', en: 'Sign in' },
    register_title:   { ka: 'დარეგისტრირდი', en: 'Register' },
    register_subtitle:{ ka: 'შექმენი შენი სააგენტო', en: 'Create your agency' },
    full_name:        { ka: 'სახელი და გვარი', en: 'Full name' },
    company_name:     { ka: 'სააგენტოს სახელი', en: 'Agency name' },
    phone:            { ka: 'ტელეფონი', en: 'Phone' },
    password_min:     { ka: 'პაროლი (მინ. 6 სიმბოლო)', en: 'Password (min. 6 chars)' },
    register_btn:     { ka: 'დარეგისტრირდი', en: 'Register' },
    forgot_link:      { ka: 'პაროლი დაგავიწყდა?', en: 'Forgot your password?' },
    forgot_title:     { ka: 'პაროლის აღდგენა', en: 'Reset password' },
    forgot_subtitle:  { ka: 'მიუთითე ელფოსტა — გამოგიგზავნით აღდგენის ბმულს', en: "Enter your email and we'll send you a reset link" },
    forgot_btn:       { ka: 'ბმულის გაგზავნა', en: 'Send reset link' },
    back_to_login:    { ka: '← შესვლაზე დაბრუნება', en: '← Back to sign in' },
    forgot_need_email:{ ka: 'შეავსე ელ. ფოსტა', en: 'Enter your email' },
    forgot_sent:      { ka: 'თუ ეს ელფოსტა რეგისტრირებულია, აღდგენის ბმული გაიგზავნა.', en: 'If that email is registered, a reset link has been sent.' },
    forgot_failed:    { ka: 'ვერ მოხერხდა. სცადე თავიდან.', en: 'Something went wrong. Please try again.' },
    sending:          { ka: 'იგზავნება...', en: 'Sending...' },
};

// Look up a translated string for use in JS (the data-i18n attribute only
// covers static markup).
function t(key) {
    return (I18N[key] && I18N[key][currentLang]) || key;
}
let currentLang = (function(){ try { return localStorage.getItem('atlas_lang') || localStorage.getItem('warm_lang') || 'ka'; } catch(e){ return 'ka'; } })();
function applyLang() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (I18N[key] && I18N[key][currentLang]) el.textContent = I18N[key][currentLang];
    });
    document.documentElement.lang = currentLang;
    const ka = document.getElementById('lang-ka'), en = document.getElementById('lang-en');
    if (ka && en) {
        ka.style.background = currentLang === 'ka' ? 'var(--brand)' : 'var(--surface-2)';
        ka.style.color = currentLang === 'ka' ? '#fff' : 'var(--text-muted)';
        en.style.background = currentLang === 'en' ? 'var(--brand)' : 'var(--surface-2)';
        en.style.color = currentLang === 'en' ? '#fff' : 'var(--text-muted)';
    }
}
function setLang(lang) {
    currentLang = lang;
    try { localStorage.setItem('atlas_lang', lang); } catch(e){}
    applyLang();
}

function showAlert(msg, type) {
    const a = document.getElementById('alert');
    a.textContent = msg;
    a.className = 'alert show ' + (type || 'error');
    if (type === 'success') {
        setTimeout(() => a.classList.remove('show'), 5000);
    }
}

function hideAlert() {
    document.getElementById('alert').classList.remove('show');
}

async function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    
    if (!email || !password) {
        showAlert('შეავსე ელ. ფოსტა და პაროლი');
        return;
    }
    
    const btn = document.getElementById('btn-login');
    btn.disabled = true;
    btn.textContent = 'მუშავდება...';
    
    try {
        const result = await client.auth.signInWithPassword({ email, password });
        
        if (result.error) {
            let msg = result.error.message;
            if (msg.includes('Invalid login')) msg = 'არასწორი ელ. ფოსტა ან პაროლი';
            if (msg.includes('Email not confirmed')) msg = 'ჯერ დაადასტურე ფოსტა';
            showAlert(msg);
            btn.disabled = false;
            btn.textContent = 'შესვლა';
            return;
        }
        
        showAlert('მოგესალმები!', 'success');
        setTimeout(() => { window.location.href = '/app'; }, 800);
        
    } catch (e) {
        showAlert('შეცდომა: ' + e.message);
        btn.disabled = false;
        btn.textContent = 'შესვლა';
    }
}

async function doRegister() {
    const name = document.getElementById('reg-name').value.trim();
    const company = document.getElementById('reg-company').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const password = document.getElementById('reg-password').value;
    
    if (!name || !company || !email || !password) {
        showAlert('შეავსე ყველა ველი');
        return;
    }
    
    if (password.length < 6) {
        showAlert('პაროლი მინ. 6 სიმბოლო');
        return;
    }
    
    const btn = document.getElementById('btn-register');
    btn.disabled = true;
    btn.textContent = 'მუშავდება...';
    
    try {
        const nameParts = name.split(' ');
        const firstName = nameParts[0];
        const lastName = nameParts.slice(1).join(' ') || null;

        // The server's /api/auth/signup creates the company + founder user
        // (with hashed password) atomically and logs the user in. No extra
        // company/user inserts are needed here.
        const authResult = await client.auth.signUp({
            email: email,
            password: password,
            options: { data: {
                first_name: firstName,
                last_name: lastName,
                company_name: company,
                phone: phone,
            }}
        });

        if (authResult.error) {
            let msg = authResult.error.message;
            if (msg.includes('already exists') || msg.includes('already registered')) msg = 'ეს ფოსტა უკვე დარეგისტრირებულია';
            showAlert(msg);
            btn.disabled = false;
            btn.textContent = 'დარეგისტრირდი';
            return;
        }

        if (!authResult.data || !authResult.data.user) {
            showAlert('შეცდომა — მომხმარებელი ვერ შეიქმნა');
            btn.disabled = false;
            btn.textContent = 'დარეგისტრირდი';
            return;
        }

        showAlert('წარმატებით დარეგისტრირდი!', 'success');
        setTimeout(() => { window.location.href = '/app'; }, 1500);

    } catch (e) {
        showAlert('შეცდომა: ' + e.message);
        btn.disabled = false;
        btn.textContent = 'დარეგისტრირდი';
    }
}

function renderLucide(){
    if (window.lucide && typeof window.lucide.createIcons==='function') {
        try { window.lucide.createIcons(); } catch(e){}
    }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => { renderLucide(); applyLang(); });
else { renderLucide(); applyLang(); }

</script>

</body>
</html>
